[package]
name = "terminite"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Release build: fully optimized + slim. LTO + a single codegen unit trade
# compile time for runtime speed and a smaller binary; strip drops symbols.
# `panic` is left as the default (unwind) on purpose — terminite leans on Drop
# for teardown (PTY shutdown, socket removal), and unwind keeps those running
# on a panic. Add `panic = "abort"` if binary size wins out over that.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[features]
# Terminite's own voice — a small local LLM (GGUF via llama.cpp) so the app
# itself can converse: explain its config, say who's in the room, suggest
# exact edits. Off by default (needs cmake + a C++ compile); tools/build-app.sh
# ships the bundle with it ON. Weights are never bundled — `terminite voice
# download` fetches a pinned, checksummed GGUF into ~/.terminite/models.
voice = ["dep:llama-cpp-2"]

[dependencies]
# Vendored fork — adds OSC 7 (cwd) + OSC 133 (shell integration) dispatch.
# See vendor/. terminite owns these patches; they travel with the repo.
alacritty_terminal = { path = "vendor/alacritty_terminal" }
# The voice: llama.cpp bindings (GGUF inference, Metal on macOS). Optional —
# only the `voice` feature pulls it and its C++ build in.
llama-cpp-2 = { version = "0.1.154", optional = true }
arboard = "3.6.1"
base64 = "0.22"
libc = "0.2"
png = "0.17"
# Multi-format decoder for the Preview module. Default features off
# to skip formats we don't intend to support yet (tiff/avif/ico/…) —
# keep this list lean and add only when we actually want them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Syntax highlighting for the Editor pane. `default-fancy` selects
# the pure-Rust fancy-regex engine so we avoid the onig C dependency.
# Bundled syntaxes + themes cover ~50 languages — enough to land
# the recognizable "you're editing real code" feel.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Watch ~/.terminite/modules/ — a module added (or removed) on disk
# triggers an auto-reload without the user running `terminite module
# reload`. Default features include FSEvents on macOS.
notify = "6"
# Edit config.toml while preserving the user's comments, whitespace,
# and key ordering. The schema-driven config module writes through
# this so a `set` doesn't flatten the file's hand-tuned shape.
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30.13"
# CPU rendering. softbuffer owns the window's pixel buffer and blits it
# synchronously; cosmic-text shapes and rasterizes the glyphs. Together these
# replaced wgpu + glyphon — see SOFTBUFFER_PORT.md.
softbuffer = "0.4"
cosmic-text = "0.18"
tungstenite = "0.29.0"
# Extended syntect grammar set (Rust, TypeScript, TOML, …) — fancy-regex engine
# to match our syntect `default-fancy`, so no Oniguruma C dependency.
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }

# macOS only: register the ApplePressAndHoldEnabled default for this process so
# held keys repeat instead of opening the accent popover (see
# `disable_press_and_hold`). Foundation calls only — the CAMetalLayer opacity
# hack that used to live here went away with wgpu.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
